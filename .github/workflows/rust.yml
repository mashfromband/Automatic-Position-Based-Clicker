name: Rust Windows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Release executable
        run: cargo build --locked --release --bins
      - uses: actions/upload-artifact@v4
        with:
          name: Multi-Point-Clicker-Windows
          path: |
            target/release/multi-point-clicker.exe
            target/release/clicker-launcher.exe

  release:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Multi-Point-Clicker-Windows
          path: release-files
      - name: Publish a tested stable version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "([0-9]+\.[0-9]+\.[0-9]+)"$').Matches.Groups[1].Value
          if (-not $version) { throw 'Package version is missing' }
          $tag = "v$version"
          $existingJson = gh release view $tag --json isDraft,targetCommitish 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            $existing = $existingJson | ConvertFrom-Json
            if (-not $existing.isDraft) { Write-Output "$tag is already published"; exit 0 }
            if ($existing.targetCommitish -ne $env:RELEASE_COMMIT) { throw 'Draft belongs to another commit' }
          }
          $tagRefs = @(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the release tag' }
          if ($tagRefs.Count -gt 0) {
            $tagCommit = ($tagRefs[-1] -split '\s+')[0]
            if ($tagCommit -ne $env:RELEASE_COMMIT) { throw 'Release tag belongs to another commit' }
          }
          Copy-Item -LiteralPath release-files/multi-point-clicker.exe -Destination release-files/multi-point-clicker-windows-x86_64.exe
          New-Item -ItemType Directory -Path portable | Out-Null
          Copy-Item -LiteralPath release-files/multi-point-clicker.exe -Destination portable/multi-point-clicker.exe
          Copy-Item -LiteralPath release-files/clicker-launcher.exe -Destination 'portable/Multi Point Clicker.exe'
          Compress-Archive -LiteralPath 'portable/multi-point-clicker.exe', 'portable/Multi Point Clicker.exe' -DestinationPath release-files/multi-point-clicker-windows-x86_64.zip
          if ($exists) {
            gh release upload $tag release-files/multi-point-clicker-windows-x86_64.exe release-files/multi-point-clicker-windows-x86_64.zip --clobber
          } else {
            gh release create $tag release-files/multi-point-clicker-windows-x86_64.exe release-files/multi-point-clicker-windows-x86_64.zip --target $env:RELEASE_COMMIT --title "Multi Point Clicker $version" --notes 'Windows版です。初回はZIPを展開し、Multi Point Clicker.exeから起動してください。以後は起動時に最新版を確認します。' --draft
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the release' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release' }
